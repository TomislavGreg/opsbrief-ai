services:
  api:
    build: .
    image: opsbrief-ai:local
    # Copy .env.example to .env before starting: Compose requires the file.
    env_file: .env
    # Published on the loopback interface only: the service is reachable from the
    # host but not from the network. Exposing it externally is a deliberate change,
    # normally via a reverse proxy that terminates TLS (see docs/deployment.md).
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
